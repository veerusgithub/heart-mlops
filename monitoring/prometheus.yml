global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "heart-api"
    metrics_path: /metrics
    static_configs:
      # when run via docker-compose, the API is reachable as service "heart-api"
      - targets: ["heart-api:8000"]
        labels:
          service: "heart-disease-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
